<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeyn Yuguradi">
<meta name="theme-color" content="#3b2340">
<meta name="description" content="Zeyn Yuguradi — Zeyn va mushukcha Chom bilan ko'cha bo'ylab yuguring: yo'lak almashtiring, sakrang, engashing, tanga yig'ing.">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Zeyn Yuguradi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap">
<style>
  /* Layout: butun ekran — bitta vertikal 3D-effektli ko'cha sahnasi (canvas). Ustida HUD va oynalar: menyu, do'kon, natija, pauza. Uslub: pastel, multfilm. */
  :root {
    --bg: #3b2340; --card: #fff8f2; --ink: #5a3352; --muted: #9a7891;
    --pink: #ff6fa5; --pink-d: #d9467f; --mint: #46c79a; --gold: #ffc93c; --line: #f0dbe6;
    --display: "Lilita One", "Arial Black", sans-serif;
    --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #wrap { position: relative; }
  canvas#c { display: block; }
  @media (min-aspect-ratio: 10/16) { canvas#c, .screen { border-radius: 22px; } canvas#c { box-shadow: 0 30px 80px rgba(0,0,0,.5); } }

  .hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; }
  .hud[hidden] { display: none; }
  .pill { background: rgba(255,248,242,.92); border-radius: 999px; padding: 7px 12px; font: 400 18px/1 var(--display); display: flex; align-items: center; gap: 6px; color: var(--ink); box-shadow: 0 3px 0 rgba(90,51,82,.15); white-space: nowrap; }
  .coin { width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 55%, #d99a00); flex: none; display: inline-block; }
  .hud button { pointer-events: auto; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .screen[hidden] { display: none; }
  .dim { background: rgba(59,35,64,.55); }
  .card { background: var(--card); border-radius: 24px; padding: 20px 18px; width: min(360px, 100%); box-shadow: 0 20px 60px rgba(40,20,40,.4); display: flex; flex-direction: column; gap: 12px; align-items: center; max-height: 100%; }
  .card h2 { margin: 0; font: 400 30px/1.05 var(--display); color: var(--pink); }
  .card p { margin: 0; color: var(--muted); line-height: 1.4; }
  .head { background: rgba(90,51,82,.82); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(360px, 100%); box-shadow: 0 14px 40px rgba(59,35,64,.35); }
  .title { margin: 0; font: 400 clamp(42px, 12vw, 56px)/.92 var(--display); color: #fff; text-shadow: 0 4px 0 var(--pink-d), 0 10px 24px rgba(59,35,64,.4); }
  .title small { display: block; font-size: .5em; color: var(--gold); text-shadow: 0 3px 0 #b77a00; letter-spacing: .03em; }
  #sMenu { justify-content: flex-start; }
  .spacer { flex: 1; }
  .col { display: flex; flex-direction: column; gap: 9px; width: min(320px, 100%); }
  .row { display: flex; gap: 8px; width: 100%; }
  .row > * { flex: 1; }
  button { font: 800 15px/1 var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; cursor: pointer; }
  button:active { transform: translateY(2px); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .big { background: var(--pink); color: #fff; border-color: transparent; font: 400 26px/1 var(--display); padding: 16px 20px; box-shadow: 0 6px 0 var(--pink-d); }
  .big:active { box-shadow: 0 2px 0 var(--pink-d); transform: translateY(4px); }
  .ic { width: 42px; height: 42px; padding: 0; border-radius: 14px; display: grid; place-items: center; font-size: 17px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .stats div { background: #fdeef3; border-radius: 14px; padding: 9px; }
  .stats b { display: block; font: 400 26px/1.1 var(--display); }
  .stats small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .rec { color: var(--pink-d) !important; font-weight: 800; }

  #sShop .card { height: 100%; padding: 14px 12px; gap: 10px; }
  .shopTop { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  #prev { width: 220px; height: 170px; flex: none; }
  .tabs { display: flex; gap: 4px; background: #fbe7ef; padding: 4px; border-radius: 13px; width: 100%; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 2px; border-radius: 10px; font-size: 14px; }
  .tabs button[aria-selected="true"] { background: var(--pink); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; overflow-y: auto; touch-action: pan-y; padding: 2px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; font-size: 13px; background: #fff; }
  .item .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .item .price { display: flex; align-items: center; gap: 4px; font: 400 15px/1 var(--display); color: #c88a00; }
  .item .price .coin { width: 13px; height: 13px; }
  .item .own { font-size: 12px; color: var(--muted); font-weight: 600; }
  .item[aria-pressed="true"] { border-color: var(--pink); background: #ffe8f2; }
  .item[aria-pressed="true"] .own { color: var(--pink-d); }
  .item.locked { opacity: .55; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Zeyn Yuguradi o'yin maydoni"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="pill"><span class="coin"></span><span id="hCoins">0</span></div>
    <div class="pill" id="hDist">0 m</div>
    <button class="ic" id="bPause" aria-label="Pauza">❚❚</button>
  </div>

  <div class="screen" id="sMenu">
    <div class="head">
      <h1 class="title"><small>ZEYN</small>YUGURADI</h1>
      <div class="row" style="width:auto;justify-content:center">
        <div class="pill" id="mBest">🏆 0 m</div>
        <div class="pill"><span class="coin"></span><span id="mCoins">0</span></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="col">
      <button class="big" id="bPlay">YUGURISH</button>
      <button id="bShop">👗 Do'kon: Zeyn va Chom</button>
    </div>
  </div>

  <div class="screen dim" id="sShop" hidden>
    <div class="card">
      <div class="shopTop">
        <button class="ic" id="bShopClose" aria-label="Yopish">✕</button>
        <h2>Do'kon</h2>
        <div class="pill" style="box-shadow:none;background:#fdeef3"><span class="coin"></span><span id="sCoins">0</span></div>
      </div>
      <canvas id="prev" aria-label="Zeyn va Chom ko'rinishi"></canvas>
      <div class="tabs" role="tablist" id="tabs">
        <button data-t="dress" aria-selected="true">Ko'ylak</button>
        <button data-t="hair" aria-selected="false">Soch</button>
        <button data-t="collar" aria-selected="false">Chom</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="screen dim" id="sOver" hidden>
    <div class="card">
      <h2>Voy, Zeyn!</h2>
      <p id="oRec"></p>
      <div class="stats">
        <div><b id="oDist">0</b><small>metr</small></div>
        <div><b id="oCoins">0</b><small>tanga</small></div>
      </div>
      <button class="big" id="bRetry" style="width:100%">YANA</button>
      <div class="row"><button id="bOverShop">👗 Do'kon</button><button id="bOverMenu">Menyu</button></div>
    </div>
  </div>

  <div class="screen dim" id="sPause" hidden>
    <div class="card">
      <h2>Pauza</h2>
      <button class="big" id="bResume" style="width:100%">DAVOM</button>
      <div class="row"><button id="bMute">Ovoz: yoqiq</button><button id="bQuit">Menyu</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ====================== asosiy o'lchamlar ======================
  const W = 400, H = 720, HY = 236;          // HY — ufq chizig'i
  const CAMH = 1.15, F = 1828, ZP = 5;       // kamera balandligi, fokus, Zeynning chuqurligi
  const LW = 0.5, ROAD = 0.78;               // yo'lak oralig'i, yo'l yarim kengligi
  const SPAWN_Z = 58, NEAR_Z = 1.2;
  const PS = 243.8;                           // rasmlar uchun asosiy masshtab (kamera yaqinlashgani uchun hammasi 1.5x katta)
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);

  // ====================== saqlash ======================
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const DEF = { coins: 0, best: 0, muted: false, tut: false, dress: 'pushti', hair: 'jigar', collar: 'pushti', own: { dress: ['pushti'], hair: ['jigar'], collar: ['pushti'] } };
  const save = Object.assign({}, DEF, store.get('zeynyuguradi', {}));
  save.own = Object.assign({}, DEF.own, save.own);
  const persist = () => store.set('zeynyuguradi', save);

  const SHOP = {
    dress: [
      { id: 'pushti', name: 'Pushti', c: ['#ffb3d3', '#ff86b8', '#e9609c'], cost: 0 },
      { id: 'osmon', name: 'Osmon', c: ['#bfe6ff', '#86c8f5', '#5a9fe0'], cost: 80 },
      { id: 'yalpiz', name: 'Yalpiz', c: ['#c4f5e0', '#86e3bd', '#45c095'], cost: 150 },
      { id: 'lavanda', name: 'Lavanda', c: ['#e2d2ff', '#c3a2ff', '#9a6be0'], cost: 220 },
      { id: 'atlas', name: 'Atlas', c: ['#ff9cc8', '#ff4f8b', '#6a3cff'], cost: 400, atlas: true },
      { id: 'oltin', name: 'Oltin', c: ['#fff0b0', '#ffd24a', '#e0a020'], cost: 700, sparkle: true }
    ],
    hair: [
      { id: 'jigar', name: 'Jigarrang', c: ['#8a4a2c', '#6b3420', '#4e2416'], cost: 0 },
      { id: 'qora', name: 'Qora', c: ['#4a3a44', '#2e2228', '#1a1216'], cost: 60 },
      { id: 'sariq', name: 'Sariq', c: ['#ffe08a', '#e8b84a', '#c08a2a'], cost: 120 },
      { id: 'malla', name: 'Malla', c: ['#e0703a', '#c4522d', '#8a3418'], cost: 160 },
      { id: 'pushti', name: 'Pushti', c: ['#ffc2dc', '#ff8fbd', '#d9609a'], cost: 300 }
    ],
    collar: [
      { id: 'pushti', name: 'Pushti', c: ['#ff5d8f'], cost: 0 },
      { id: 'kok', name: "Ko'k", c: ['#4fa8ff'], cost: 50 },
      { id: 'yashil', name: 'Yashil', c: ['#3fcf8e'], cost: 50 },
      { id: 'binafsha', name: 'Binafsha', c: ['#9a6bff'], cost: 80 },
      { id: 'tilla', name: 'Tilla', c: ['#ffc93c'], cost: 150 }
    ]
  };
  const pick = (cat, id) => SHOP[cat].find(i => i.id === id) || SHOP[cat][0];

  // ====================== o'lcham ======================
  let scale = 1, dpr = 1;
  function resize() {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cvs.style.width = W * scale + 'px'; cvs.style.height = H * scale + 'px';
    cvs.width = Math.round(W * scale * dpr); cvs.height = Math.round(H * scale * dpr);
    $('wrap').style.width = W * scale + 'px'; $('wrap').style.height = H * scale + 'px';
  }
  window.addEventListener('resize', resize); resize();

  // ====================== ovoz ======================
  let ac = null;
  function sfx(f, d = .08, type = 'sine', v = .05, slide = 0) {
    if (save.muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch {}
  }
  let lastCoinSfx = 0;
  const coinSfx = () => { if (time - lastCoinSfx < .04) return; lastCoinSfx = time; sfx(1320, .05, 'square', .022); setTimeout(() => sfx(1760, .07, 'square', .018), 40); };
  const meow = () => { sfx(700, .22, 'sine', .045, 500); setTimeout(() => sfx(1100, .18, 'sine', .035, -500), 110); };

  // ====================== proyeksiya ======================
  let camX = 0;
  function P(x, y, z) { const s = F / z; return { x: W / 2 + (x - camX) * s, y: HY + (CAMH - y) * s, s }; }
  const fogA = z => Math.max(0, Math.min(1, (SPAWN_Z - z) / 14));

  // ====================== chizish yordamchilari ======================
  const OL = '#5b2a4f';
  function lg(c, x0, y0, x1, y1, st) { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
  function rg(c, x, y, r0, r1, st) { const g = c.createRadialGradient(x, y, r0, x, y, r1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
  function fs(c, fill, w = 2.4) { c.fillStyle = fill; c.fill(); c.lineWidth = w; c.strokeStyle = OL; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
  function nameTag(c, x, y, text, s = 1) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.font = '20px "Lilita One", "Arial Black", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const w = c.measureText(text).width + 28;
    c.fillStyle = 'rgba(91,42,79,.2)'; c.beginPath(); c.roundRect(-w / 2, -12, w, 30, 15); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(-w / 2, -15, w, 30, 15); c.fill();
    c.beginPath(); c.moveTo(-7, 14); c.lineTo(0, 22); c.lineTo(7, 14); c.fill();
    c.strokeStyle = '#ff8fbd'; c.lineWidth = 3; c.beginPath(); c.roundRect(-w / 2, -15, w, 30, 15); c.stroke();
    c.fillStyle = '#e0457f'; c.fillText(text, 0, 1);
    c.restore();
  }
  function tiara(c, x, y, s = 1) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.beginPath(); c.moveTo(-26, 6); c.lineTo(-23, -7); c.lineTo(-14, 1); c.lineTo(-8, -15); c.lineTo(-2, -2); c.lineTo(0, -24); c.lineTo(2, -2); c.lineTo(8, -15); c.lineTo(14, 1); c.lineTo(23, -7); c.lineTo(26, 6); c.quadraticCurveTo(0, 13, -26, 6); c.closePath();
    fs(c, lg(c, 0, -24, 0, 10, [[0, '#fff3b0'], [.5, '#ffd24a'], [1, '#e8a317']]), 2);
    c.fillStyle = '#ff4f8b'; c.beginPath(); c.ellipse(0, -6, 4.5, 6, 0, 0, 7); c.fill(); c.strokeStyle = OL; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-1.5, -8, 1.5, 0, 7); c.fill();
    for (const k of [-14, 14]) { c.fillStyle = '#4fd6cf'; c.beginPath(); c.arc(k, 3, 3, 0, 7); c.fill(); c.stroke(); }
    c.restore();
  }
  function skirtFill(c, D, x0, x1) { return lg(c, x0, 0, x1, 0, [[0, D.c[0]], [.5, D.c[1]], [1, D.c[2]]]); }
  function atlasOver(c, D) {
    if (!D.atlas) return;
    c.save(); c.clip(); c.globalAlpha = .8;
    const cols = ['#ffd84a', '#3fd0c9', '#ffffff', '#6a3cff'];
    for (let i = 0; i < 16; i++) { c.strokeStyle = cols[i % 4]; c.lineWidth = 4; c.beginPath(); for (let y = -170; y <= 0; y += 8) c.lineTo(-80 + i * 10 + Math.sin(y / 9 + i) * 4, y); c.stroke(); }
    c.restore();
  }

  // ---- dumalash: g'ujanak to'p, ustidagi belgilar oldinga aylanadi ----
  function rollBall(c, Rr, phase, base, edge, feats) {
    c.save(); c.translate(0, -Rr);
    c.beginPath(); c.arc(0, 0, Rr, 0, 7); fs(c, rg(c, -Rr * .35, -Rr * .4, Rr * .1, Rr * 1.1, [[0, base[0]], [1, base[1]]]), 2.6);
    c.save(); c.beginPath(); c.arc(0, 0, Rr - 1.5, 0, 7); c.clip();
    for (const f of feats) {
      const a = f.a + phase, ca = Math.cos(a);
      if (ca <= .05) continue;
      const y = -Rr * Math.sin(a) * .92;
      c.save(); c.translate(f.x || 0, y); c.scale(1, Math.max(.15, ca));
      f.draw(c); c.restore();
    }
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, Rr * .72, Math.PI * 1.15, Math.PI * 1.5); c.stroke();
    c.beginPath(); c.arc(0, 0, Rr, 0, 7); c.strokeStyle = edge; c.lineWidth = 2.6; c.stroke();
    c.restore();
  }

  // ---- Zeyn orqadan (yugurish) ----
  function zeynBack(c, x, y, s, t, pose, alpha = 1) {
    const D = pick('dress', save.dress), HR = pick('hair', save.hair).c, SKIN = '#ffe2cf';
    c.save(); c.globalAlpha = alpha; c.translate(x, y); c.scale(s, s);
    const ph = t * 12, run = pose === 'run';
    const bob = run ? -Math.abs(Math.sin(ph)) * 7 : 0;
    // soya
    if (pose === 'slide') {
      const HR2 = HR, ph2 = -t * 15, Rr = 54;
      // tuflilar pastdan chiqib turadi
      for (const d of [-1, 1]) { c.beginPath(); c.ellipse(d * 30, -8, 14, 9, d * .3, 0, 7); fs(c, '#e9609c', 2); c.fillStyle = '#fff'; c.fillRect(d * 30 - 8, -18, 16, 5); }
      rollBall(c, Rr, ph2, [HR2[0], HR2[2]], OL, [
        { a: 0, draw: k => { k.strokeStyle = 'rgba(255,225,190,.35)'; k.lineWidth = 4; k.beginPath(); k.arc(0, 10, 34, Math.PI * 1.15, Math.PI * 1.6); k.stroke(); } },
        { a: .55, draw: k => tiara(k, 0, 0, .95) },
        { a: -1.0, draw: k => { k.fillStyle = D.c[1]; k.beginPath(); k.ellipse(0, 0, 56, 26, 0, 0, 7); k.fill(); k.strokeStyle = '#fff'; k.lineWidth = 3; k.beginPath(); for (let i = 0; i < 7; i++) { const x0 = -52 + i * 15; k.moveTo(x0, 18); k.quadraticCurveTo(x0 + 7.5, 25, x0 + 15, 18); } k.stroke(); } },
        { a: -1.35, draw: k => { k.fillStyle = '#b48cff'; for (const d of [-1, 1]) { k.beginPath(); k.ellipse(d * 14, 0, 14, 8, 0, 0, 7); k.fill(); } k.fillStyle = '#e6d6ff'; k.beginPath(); k.arc(0, 0, 5, 0, 7); k.fill(); } },
        ...[1.6, 2.6, 3.6, 4.6].map(a => ({ a, draw: k => { k.strokeStyle = 'rgba(40,20,10,.4)'; k.lineWidth = 2.5; for (const d of [-22, 0, 22]) { k.beginPath(); k.moveTo(d - 6, -6); k.quadraticCurveTo(d, 0, d + 6, 6); k.stroke(); } } }))
      ]);
      // tizzani quchoqlagan qo'llar yonlarda
      for (const d of [-1, 1]) { c.beginPath(); c.ellipse(d * (Rr - 4), -Rr * .9, 9, 14, d * .4, 0, 7); fs(c, '#ffe2cf', 2); }
      // chang
      c.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 3; i++) { const r = 8 + ((t * 40 + i * 9) % 14); c.globalAlpha = alpha * (1 - ((t * 40 + i * 9) % 14) / 14); c.beginPath(); c.arc(-40 + i * 40, -4, r, 0, 7); c.fill(); }
      c.restore(); return;
    }
    if (pose === 'fall') { c.rotate(.9); }
    c.translate(0, bob + (pose === 'jump' ? -10 : 0));
    // oyoqlar
    const legs = pose === 'jump' ? [[-14, -60, .35], [14, -58, -.35]] : run ? [[-15, -50 + Math.max(0, Math.sin(ph)) * -16, Math.sin(ph) * .3], [15, -50 + Math.max(0, -Math.sin(ph)) * -16, -Math.sin(ph) * .3]] : [[-15, -50, 0], [15, -50, 0]];

  const LANES = [-1, 0, 1];
  function coinLine(l, z0, n = 5, arc = false) {
    for (let i = 0; i < n; i++) coins.push({ x: l * LW, y: arc ? .16 + Math.sin(i / (n - 1) * Math.PI) * .32 : .14, z: z0 + i * 1.1 });
  }
  function spawnRow() {
    const z = SPAWN_Z, lvl = Math.min(1, dist / 1500);
    const free = LANES[Math.random() * 3 | 0];
    const others = LANES.filter(l => l !== free);
    const r = Math.random();
    const low = () => Math.random() < .5 ? 'arava' : 'qovun';
    if (r < .3) {           // bitta to'siq
      const l = others[Math.random() * 2 | 0];
      const type = Math.random() < .35 ? 'soyabon' : low();
      addOb(type, l, z);
      if (type !== 'soyabon' && Math.random() < .6) coinLine(l, z - 2.4, 5, true); else coinLine(free, z - 2, 5);
    } else if (r < .55) {   // ikkita to'siq
      addOb(low(), others[0], z); addOb(Math.random() < .5 ? 'soyabon' : low(), others[1], z);
      coinLine(free, z - 1, 6);
    } else if (r < .8 && lvl > .05) { // avtobus + to'siq
      addOb('avtobus', others[0], z);
      if (Math.random() < .6) addOb(low(), others[1], z + 1.5);
      coinLine(free, z, 6);
    } else {                // ikki avtobus — bitta erkin yo'lak
      addOb('avtobus', others[0], z); addOb('avtobus', others[1], z + 3 + Math.random() * 2);
      coinLine(free, z, 7);
    }
    if (Math.random() < .09) items.push({ x: free * LW, y: .2, z: z + 4, kind: ['magnet', 'shield', 'shoes'][Math.random() * 3 | 0] });
    nextRow = 9 + Math.random() * 4 - lvl * 2 + speed * .25;
  }
  const OB = {
    arava: { w: .4, h: .2, d: .45 },
    qovun: { w: .36, h: .17, d: .35 },
    soyabon: { w: .46, h: .4, d: .12, y0: .25 },
    avtobus: { w: .46, h: .56, d: 2.6, mv: 3 }
  };
  function addOb(type, l, z) { const o = OB[type]; obs.push({ type, x: l * LW, z, w: o.w, h: o.h, d: o.d, y0: o.y0 || 0, mv: o.mv || 0, v: Math.random() }); }

  // ====================== boshqaruv ======================
  function move(d) {
    if (state !== 'play') return;
    const nl = Math.max(-1, Math.min(1, lane + d));
    if (nl !== lane) { lane = nl; sfx(500 + d * 60, .05, 'triangle', .035); }
    else { shake = 3; sfx(180, .06, 'square', .025); }
  }
  function jump() {
    if (state !== 'play' || !grounded) return;
    vy = shoes > 0 ? 3.3 : 2.35; grounded = false; slideT = 0;
    chom.jumpAt = time + .12;
    sfx(520, .14, 'sine', .05, 300);
    dust(.6);
  }
  function slide() {
    if (state !== 'play') return;
    if (!grounded) vy = -4.5;
    slideT = .65; chom.slideAt = time + .1;
    sfx(260, .12, 'sine', .04, -120);
  }
  function dust(n) { const p = P(px, 0, ZP); for (let i = 0; i < 6 * n; i++) parts.push({ x: p.x + (Math.random() - .5) * 30, y: p.y, vx: (Math.random() - .5) * 80, vy: -30 - Math.random() * 40, life: .5, c: 'rgba(255,255,255,.85)', s: 3 + Math.random() * 3, g: 60 }); }

  // ====================== yangilash ======================
  function update(dt) {
    time += dt;
    for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floats) f.t += dt;
    floats = floats.filter(f => f.t < 1);
    shake = Math.max(0, shake - dt * 30);

    const sp = state === 'play' ? speed : state === 'dead' ? 0 : 4; // menyuda sekin yuradi
    for (const s of scene) s.z -= sp * dt;
    scene = scene.filter(s => s.z > NEAR_Z); sceneT -= sp * dt; fillScene();

    if (state === 'dead') {
      deadT += dt; vy -= 6 * dt; py = Math.max(0, py + vy * dt);
      return;
    }
    if (state !== 'play') { camX += (0 - camX) * Math.min(1, dt * 3); return; }

    speed = Math.min(27, 11 + dist * .011);
    dist += speed * dt;
    tutT = Math.max(0, tutT - dt);
    if (tutT === 0 && !save.tut && dist > 60) { save.tut = true; persist(); }
    inv = Math.max(0, inv - dt); magnet = Math.max(0, magnet - dt); shoes = Math.max(0, shoes - dt);

    // qator yaratish
    nextRow -= speed * dt;
    if (nextRow <= 0) spawnRow();

    // Zeyn harakati
    px += (lane * LW - px) * Math.min(1, dt * 13);
    camX += (px * .55 - camX) * Math.min(1, dt * 6);
    if (!grounded) { vy -= 8.2 * dt; py += vy * dt; if (py <= 0) { py = 0; vy = 0; grounded = true; dust(.5); } }
    slideT = Math.max(0, slideT - dt);

    // Chom ergashadi
    const cTarget = px + (lane >= 1 ? -.3 : .3);
    chom.x += (cTarget - chom.x) * Math.min(1, dt * 8);
    if (chom.jumpAt > 0 && time >= chom.jumpAt) { chom.vy = shoes > 0 ? 3 : 2.2; chom.jumpAt = -1; if (Math.random() < .25) meow(); }
    if (chom.y > 0 || chom.vy > 0) { chom.vy -= 8.2 * dt; chom.y += chom.vy * dt; if (chom.y <= 0) { chom.y = 0; chom.vy = 0; } }
    if (chom.slideAt > 0 && time >= chom.slideAt) { chom.slideT = .6; chom.slideAt = -1; }
    chom.slideT = Math.max(0, chom.slideT - dt);

    // obyektlar yaqinlashadi
    const mv = speed * dt;
    for (const o of obs) o.z -= mv + o.mv * dt;
    for (const c of coins) c.z -= mv;
    for (const it of items) it.z -= mv;
    obs = obs.filter(o => o.z + o.d > NEAR_Z);
    coins = coins.filter(c => c.z > NEAR_Z && !c.got);
    items = items.filter(i => i.z > NEAR_Z && !i.got);

    // to'qnashuv
    const top = py + (slideT > 0 ? .2 : .5);
    for (const o of obs) {
      if (o.dead) continue;
      if (ZP + .12 < o.z || ZP - .12 > o.z + o.d) continue;
      if (Math.abs(px - o.x) > o.w / 2 + .07) continue;
      if (top < o.y0 + .02 || py > o.y0 + o.h - .02) continue;
      if (inv > 0) continue;
      if (shield) {
        shield = false; inv = 1; o.dead = true; shake = 10;
        const p = P(o.x, .2, Math.max(o.z, 1.5)); for (let i = 0; i < 24; i++) { const a = Math.random() * 6.28; parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: .6, c: '#8fd3ff', s: 4, g: 0 }); }
        floats.push({ text: 'Qalqon!', x: W / 2, y: 330, t: 0, c: '#3d9be0' }); sfx(300, .25, 'triangle', .06, 400);
        continue;
      }
      return die();
    }
    // tangalar
    for (const c of coins) {
      if (magnet > 0 && c.z < ZP + 9 && c.z > ZP - .5) { c.x += (px - c.x) * Math.min(1, dt * 10); c.y += (py + .25 - c.y) * Math.min(1, dt * 10); }
      if (Math.abs(c.z - ZP) < .35 && Math.abs(c.x - px) < .22 && c.y > py - .1 && c.y < top + .1) {
        c.got = true; runCoins++; coinSfx();
        const p = P(c.x, c.y, ZP); for (let i = 0; i < 5; i++) parts.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 120, vy: -60 - Math.random() * 80, life: .45, c: '#ffd84a', s: 3, g: 200 });
      }
    }
    for (const it of items) {
      if (Math.abs(it.z - ZP) < .4 && Math.abs(it.x - px) < .25) {
        it.got = true;
        if (it.kind === 'magnet') { magnet = 10; floats.push({ text: 'Magnit!', x: W / 2, y: 330, t: 0, c: '#e04a5a' }); }
        if (it.kind === 'shield') { shield = true; floats.push({ text: 'Qalqon!', x: W / 2, y: 330, t: 0, c: '#3d9be0' }); }
        if (it.kind === 'shoes') { shoes = 10; floats.push({ text: 'Sakrovchi tufli!', x: W / 2, y: 330, t: 0, c: '#a061e0' }); }
        sfx(660, .1, 'triangle', .05); setTimeout(() => sfx(880, .1, 'triangle', .05), 80); setTimeout(() => sfx(1320, .14, 'triangle', .05), 160);
      }
    }
    $('hCoins').textContent = save.coins + runCoins;
    $('hDist').textContent = Math.floor(dist) + ' m';
  }

  function die() {
    state = 'dead'; deadT = 0; shake = 14; vy = 1.2; grounded = false;
    sfx(420, .5, 'sawtooth', .05, -330); setTimeout(meow, 300);
    save.coins += runCoins;
    const d = Math.floor(dist), rec = d > save.best;
    if (rec) save.best = d;
    persist();
    setTimeout(() => {
      $('oDist').textContent = d; $('oCoins').textContent = runCoins;
      $('oRec').textContent = rec ? '🏆 Yangi rekord!' : `Rekord: ${save.best} m`;
      $('oRec').className = rec ? 'rec' : '';
      show('sOver');
    }, 1200);
  }

  // ====================== chizish: dunyo ======================
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, HY);
    g.addColorStop(0, '#9fd8ff'); g.addColorStop(.7, '#ffd9ea'); g.addColorStop(1, '#ffeede');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, HY + 21);
    ctx.fillStyle = 'rgba(255,250,220,.9)'; ctx.beginPath(); ctx.arc(300 - camX * 20, 110, 30, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,.35)'; ctx.beginPath(); ctx.arc(300 - camX * 20, 110, 48, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 4; i++) { const x = ((i * 130 + time * 5) % 520) - 60 - camX * 15, y = 60 + (i % 2) * 50; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.arc(x + 18, y - 8, 18, 0, 7); ctx.arc(x + 38, y, 13, 0, 7); ctx.fill(); }
    // uzoqdagi gumbazlar va minoralar silueti
    const ox = -camX * 30;
    ctx.fillStyle = '#c9b3e6';
    for (const [x, w, h, dome] of [[20, 60, 40, 1], [95, 18, 70, 0], [130, 80, 48, 1], [230, 18, 80, 0], [260, 70, 42, 1], [345, 50, 34, 1]]) {
      const X = x + ox;
      ctx.fillRect(X, HY - h, w, h);
      if (dome) { ctx.beginPath(); ctx.ellipse(X + w / 2, HY - h, w * .32, w * .34, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(X + w / 2 - 1, HY - h - w * .34 - 8, 2, 8); }
      else { ctx.beginPath(); ctx.moveTo(X - 2, HY - h); ctx.lineTo(X + w / 2, HY - h - 14); ctx.lineTo(X + w + 2, HY - h); ctx.fill(); }
    }
    ctx.fillStyle = '#8fc7e8';
    for (const [x, w, h] of [[20, 60, 40], [130, 80, 48], [260, 70, 42]]) { const X = x + ox; ctx.beginPath(); ctx.ellipse(X + w / 2, HY - h, w * .26, w * .28, 0, Math.PI, 0); ctx.fill(); }
  }

  function quad(a, b, c2, d, fill) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c2.x, c2.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
  function drawGround() {
    ctx.fillStyle = '#b9e39a'; ctx.fillRect(-20, HY, W + 40, H - HY + 20);
    const zf = SPAWN_Z + 5, zn = NEAR_Z * .8;
    // yo'lak chetidagi piyodalar yo'lagi
    for (const s of [-1, 1]) quad(P(s * ROAD, 0, zf), P(s * (ROAD + .38), 0, zf), P(s * (ROAD + .38), 0, zn), P(s * ROAD, 0, zn), '#f3dcc8');
    // yo'l
    quad(P(-ROAD, 0, zf), P(ROAD, 0, zf), P(ROAD, 0, zn), P(-ROAD, 0, zn), '#a99bb8');
    // harakat chiziqlari
    const band = 2.2, off = dist % (band * 2);
    for (let z = band * 2 - off + .01; z < SPAWN_Z; z += band * 2) {
      if (z < zn) continue;
      quad(P(-ROAD, 0, z + band), P(ROAD, 0, z + band), P(ROAD, 0, z), P(-ROAD, 0, z), '#a092b0');
      for (const s of [-1, 1]) quad(P(s * ROAD, 0, z + band), P(s * (ROAD + .38), 0, z + band), P(s * (ROAD + .38), 0, z), P(s * ROAD, 0, z), '#ead0bb');
    }
    // bordyurlar
    for (const s of [-1, 1]) quad(P(s * ROAD, .04, zf), P(s * (ROAD + .04), .04, zf), P(s * (ROAD + .04), .04, zn), P(s * ROAD, .04, zn), '#fff4ec');
    // yo'lak chiziqlari
    const dl = 1.4, doff = dist % (dl * 2);
    for (const s of [-.5, .5]) for (let z = dl * 2 - doff; z < SPAWN_Z; z += dl * 2) {
      if (z < zn) continue;
      quad(P(s * LW * 2 - .015, 0, z + dl), P(s * LW * 2 + .015, 0, z + dl), P(s * LW * 2 + .015, 0, z), P(s * LW * 2 - .015, 0, z), 'rgba(255,255,255,.75)');
    }
    // ufq tumani
    const fg = ctx.createLinearGradient(0, HY, 0, HY + 40); fg.addColorStop(0, 'rgba(255,238,222,1)'); fg.addColorStop(1, 'rgba(255,238,222,0)');
    ctx.fillStyle = fg; ctx.fillRect(-20, HY, W + 40, 40);
  }

  // 3D quti: old, yon va tepa yuzlari
  function box(x, w, y0, h, z, d, cF, cS, cT) {
    const l = x - w / 2, r = x + w / 2;
    const f = [P(l, y0, z), P(r, y0, z), P(r, y0 + h, z), P(l, y0 + h, z)];
    const b = [P(l, y0, z + d), P(r, y0, z + d), P(r, y0 + h, z + d), P(l, y0 + h, z + d)];
    if (f[0].x > b[0].x) quad(f[0], b[0], b[3], f[3], cS);  // chap yon
    if (f[1].x < b[1].x) quad(f[1], b[1], b[2], f[2], cS);  // o'ng yon
    if (y0 + h < CAMH) quad(f[3], f[2], b[2], b[3], cT);     // tepa
    ctx.beginPath(); ctx.moveTo(f[0].x, f[0].y); ctx.lineTo(f[1].x, f[1].y); ctx.lineTo(f[2].x, f[2].y); ctx.lineTo(f[3].x, f[3].y); ctx.closePath(); ctx.fillStyle = cF; ctx.fill();
    return f;
  }

  function drawObstacle(o) {
    if (o.type !== 'avtobus' && o.z < 3.4) return;
    let z = Math.max(o.z, NEAR_Z);
    if (o.type === 'avtobus') { z = Math.max(o.z, 3); if (o.z + o.d - z <= .1) return; }
    const od = o.type === 'avtobus' ? o.z + o.d - z : o.d;
    ctx.save(); ctx.globalAlpha = fogA(z);
    const p = P(o.x, 0, z), s = p.s / PS;
    // soya
    ctx.fillStyle = 'rgba(60,30,60,.18)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, o.w / 2 * p.s * 1.05, 6 * s, 0, 0, 7); ctx.fill();
    if (o.type === 'arava') {
      const f = box(o.x, o.w, .06, .1, z, o.d, '#c98a5a', '#a8693e', '#e0a674');
      ctx.strokeStyle = '#8a5530'; ctx.lineWidth = Math.max(1, 2 * s);
      for (let i = 1; i < 4; i++) { const yy = f[0].y + (f[3].y - f[0].y) * i / 4; ctx.beginPath(); ctx.moveTo(f[0].x, yy); ctx.lineTo(f[1].x, yy); ctx.stroke(); }
      // yuk: qovun va tarvuzlar
      const tp = P(o.x, .16, z + o.d / 2);
      for (const [dx, col] of [[-.11, '#f5d36b'], [0, '#4f9a4a'], [.11, '#f5d36b'], [-.05, '#4f9a4a'], [.06, '#f5d36b']]) {
        const q = P(o.x + dx, .17 + (Math.abs(dx) < .07 ? .04 : 0), z + o.d * .45);
        ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(q.x, q.y, .06 * q.s, .045 * q.s, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = col === '#4f9a4a' ? '#2f6a2c' : '#c9a23f'; ctx.lineWidth = Math.max(.8, 1.5 * s); ctx.beginPath(); ctx.moveTo(q.x, q.y - .04 * q.s); ctx.lineTo(q.x, q.y + .04 * q.s); ctx.stroke();
      }
      for (const dx of [-.15, .15]) { const q = P(o.x + dx, .06, z); ctx.fillStyle = '#5a3a2a'; ctx.beginPath(); ctx.arc(q.x, q.y, .06 * q.s, 0, 7); ctx.fill(); ctx.fillStyle = '#c9a07a'; ctx.beginPath(); ctx.arc(q.x, q.y, .025 * q.s, 0, 7); ctx.fill(); }
    } else if (o.type === 'qovun') {
      const pile = [[-.12, .05, '#f5d36b'], [0, .05, '#e8c25a'], [.12, .05, '#f5d36b'], [-.06, .12, '#4f9a4a'], [.06, .12, '#f5d36b']];
      for (const [dx, dy, col] of pile) {
        const q = P(o.x + dx, dy, z);
        ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(q.x, q.y, .075 * q.s, .055 * q.s, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(91,42,79,.5)'; ctx.lineWidth = Math.max(.8, 1.6 * s); ctx.stroke();
        ctx.strokeStyle = col === '#4f9a4a' ? '#2f6a2c' : '#d8a740'; ctx.beginPath(); ctx.ellipse(q.x, q.y, .03 * q.s, .053 * q.s, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(q.x - .03 * q.s, q.y - .025 * q.s, .02 * q.s, .012 * q.s, 0, 0, 7); ctx.fill();
      }
    } else if (o.type === 'soyabon') {
      // ikki ustun va chiziqli soyabon — tagidan engashib o'tiladi
      for (const dx of [-o.w / 2, o.w / 2]) { const a = P(o.x + dx, 0, z), b = P(o.x + dx, o.y0 + o.h, z); ctx.strokeStyle = '#7a5a6a'; ctx.lineWidth = Math.max(1.5, 5 * s); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      const a = P(o.x - o.w / 2 - .04, o.y0 + .05, z), b = P(o.x + o.w / 2 + .04, o.y0 + o.h, z);
      const n = 6, w = (b.x - a.x) / n;
      for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#ff6f8f'; ctx.fillRect(a.x + i * w, b.y, w + .5, a.y - b.y); }
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(a.x, a.y - (a.y - b.y) * .25, b.x - a.x, (a.y - b.y) * .25);
      for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#ff6f8f'; ctx.beginPath(); ctx.arc(a.x + i * w + w / 2, a.y, w / 2, 0, Math.PI); ctx.fill(); }
      ctx.fillStyle = '#5a3352'; ctx.font = `${Math.max(6, 15 * s)}px "Lilita One", sans-serif`; ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d9467f'; ctx.lineWidth = Math.max(1, 3 * s);
      ctx.strokeText('BOZOR', (a.x + b.x) / 2, (a.y + b.y) / 2 + 4 * s); ctx.fillText('BOZOR', (a.x + b.x) / 2, (a.y + b.y) / 2 + 4 * s);
    } else if (o.type === 'avtobus') {
      const col = o.v < .5 ? ['#5fb8f0', '#3f8fcc', '#8fd3ff'] : ['#ffc94a', '#e0a020', '#ffe08a'];
      const f = box(o.x, o.w, .05, o.h, z, od, col[0], col[1], col[2]);
      if (o.z < 3) { ctx.restore(); return; }
      const fw = f[1].x - f[0].x, fh = f[0].y - f[3].y;
      // old oyna
      ctx.fillStyle = '#d8f0ff'; ctx.beginPath(); ctx.roundRect(f[3].x + fw * .08, f[3].y + fh * .1, fw * .84, fh * .4, 6 * s); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(f[3].x + fw * .15, f[3].y + fh * .14); ctx.lineTo(f[3].x + fw * .3, f[3].y + fh * .14); ctx.lineTo(f[3].x + fw * .2, f[3].y + fh * .46); ctx.lineTo(f[3].x + fw * .1, f[3].y + fh * .46); ctx.fill();
      // marshrut tablosi
      ctx.fillStyle = '#3a2a3a'; ctx.fillRect(f[3].x + fw * .25, f[3].y + fh * .02, fw * .5, fh * .07);
      ctx.fillStyle = '#ffd84a'; ctx.font = `${Math.max(5, 11 * s)}px "Lilita One", sans-serif`; ctx.textAlign = 'center'; ctx.fillText('Z-7', f[3].x + fw * .5, f[3].y + fh * .085);
      // chiroqlar
      for (const k of [.15, .85]) { ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(f[0].x + fw * k, f[0].y - fh * .18, fw * .07, 0, 7); ctx.fill(); }
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(f[0].x + fw * .3, f[0].y - fh * .22, fw * .4, fh * .08);
      ctx.fillStyle = '#3a2a3a'; ctx.fillRect(f[0].x - fw * .02, f[0].y - fh * .06, fw * 1.04, fh * .06);
    }
    ctx.restore();
  }

  function drawScene(sObj) {
    const z = sObj.z, p = P(sObj.x, 0, z), s = p.s / PS;
    if (p.y < HY - 2) return;
    ctx.save(); ctx.globalAlpha = fogA(z);
    if (sObj.kind === 'tree') {
      ctx.fillStyle = 'rgba(60,30,60,.15)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 40 * s, 8 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#9b6b4a'; ctx.fillRect(p.x - 7 * s, p.y - 90 * s, 14 * s, 90 * s);
      const cols = sObj.v < .5 ? ['#7cc98a', '#5aae6e'] : ['#9edc8f', '#6fbf6a'];
      for (const [dx, dy, r] of [[0, -150, 52], [-34, -118, 40], [34, -118, 40], [0, -100, 36]]) { ctx.fillStyle = cols[1]; ctx.beginPath(); ctx.arc(p.x + dx * s, p.y + dy * s + 4 * s, r * s, 0, 7); ctx.fill(); }
      for (const [dx, dy, r] of [[0, -152, 46], [-32, -120, 34], [32, -120, 34]]) { ctx.fillStyle = cols[0]; ctx.beginPath(); ctx.arc(p.x + dx * s, p.y + dy * s, r * s, 0, 7); ctx.fill(); }
      if (sObj.v > .7) { ctx.fillStyle = '#ffb3d1'; for (const [dx, dy] of [[-20, -150], [18, -132], [-36, -112], [30, -160]]) { ctx.beginPath(); ctx.arc(p.x + dx * s, p.y + dy * s, 6 * s, 0, 7); ctx.fill(); } }
    } else if (sObj.kind === 'lamp') {
      ctx.strokeStyle = '#6a5a7a'; ctx.lineWidth = Math.max(1, 5 * s); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 150 * s); ctx.quadraticCurveTo(p.x, p.y - 170 * s, p.x - sObj.side * 28 * s, p.y - 168 * s); ctx.stroke();
      ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(p.x - sObj.side * 30 * s, p.y - 160 * s, 9 * s, 0, 7); ctx.fill();
      ctx.fillStyle = sObj.v < .5 ? '#ff8fbd' : '#8fd3ff'; ctx.beginPath(); ctx.roundRect(p.x + (sObj.side > 0 ? -2 : -26) * s, p.y - 120 * s, 28 * s, 40 * s, 4 * s); ctx.fill();
    } else if (sObj.kind === 'house') {
      const w = 150 * s, h = (120 + sObj.v * 60) * s, x0 = p.x - w / 2;
      ctx.fillStyle = 'rgba(60,30,60,.12)'; ctx.fillRect(x0, p.y - 4 * s, w, 8 * s);
      const walls = ['#fff1e0', '#ffe3ec', '#e8f4ff', '#fff7d6'], wc = walls[(sObj.v * 4) | 0];
      ctx.fillStyle = wc; ctx.fillRect(x0, p.y - h, w, h);
      ctx.fillStyle = '#4f9fd8'; ctx.fillRect(x0 - 6 * s, p.y - h - 10 * s, w + 12 * s, 12 * s); // tom chizig'i
      // naqshli bordyur
      ctx.fillStyle = '#3fb3c9'; for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.moveTo(x0 + i * w / 10, p.y - h + 2 * s); ctx.lineTo(x0 + (i + .5) * w / 10, p.y - h + 10 * s); ctx.lineTo(x0 + (i + 1) * w / 10, p.y - h + 2 * s); ctx.fill(); }
      // ravoqli eshik va derazalar
      ctx.fillStyle = '#8a5a3a'; ctx.beginPath(); ctx.roundRect(p.x - 18 * s, p.y - 62 * s, 36 * s, 62 * s, [18 * s, 18 * s, 0, 0]); ctx.fill();
      ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(p.x + 10 * s, p.y - 30 * s, 2.5 * s, 0, 7); ctx.fill();
      for (const k of [-1, 1]) { ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.roundRect(p.x + k * 48 * s - 14 * s, p.y - h + 28 * s, 28 * s, 34 * s, [14 * s, 14 * s, 2 * s, 2 * s]); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, 3 * s); ctx.stroke(); }
      if (sObj.v > .6) { ctx.fillStyle = '#4f9fd8'; ctx.beginPath(); ctx.ellipse(p.x, p.y - h - 10 * s, 34 * s, 36 * s, 0, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#ffd84a'; ctx.fillRect(p.x - 1.5 * s, p.y - h - 58 * s, 3 * s, 12 * s); }
    } else if (sObj.kind === 'stall') {
      const w = 110 * s, x0 = p.x - w / 2;
      ctx.fillStyle = '#c98a5a'; ctx.fillRect(x0, p.y - 44 * s, w, 44 * s);
      ctx.fillStyle = '#a8693e'; ctx.fillRect(x0, p.y - 44 * s, w, 6 * s);
      const fruit = [['#ff6f6f', '#ff9a3d', '#ffd84a'], ['#f5d36b', '#4f9a4a', '#f5d36b'], ['#9a6bff', '#7fcf5a', '#ff6f8f']][(sObj.v * 3) | 0];
      for (let i = 0; i < 7; i++) { ctx.fillStyle = fruit[i % 3]; ctx.beginPath(); ctx.arc(x0 + 12 * s + i * 14 * s, p.y - 50 * s - (i % 2) * 6 * s, 8 * s, 0, 7); ctx.fill(); }
      for (const k of [0, 1]) { ctx.fillStyle = '#7a5a6a'; ctx.fillRect(x0 + k * (w - 4 * s), p.y - 120 * s, 4 * s, 76 * s); }
      const n = 5, sw2 = (w + 16 * s) / n;
      for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#fff' : (sObj.v < .5 ? '#ff8fbd' : '#5fc7c2'); ctx.fillRect(x0 - 8 * s + i * sw2, p.y - 130 * s, sw2 + .5, 26 * s); ctx.beginPath(); ctx.arc(x0 - 8 * s + i * sw2 + sw2 / 2, p.y - 104 * s, sw2 / 2, 0, Math.PI); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawCoin(c) {
    const p = P(c.x, c.y, c.z), s = p.s / PS;
    ctx.save(); ctx.globalAlpha = fogA(c.z);
    const r = .065 * p.s, sx = Math.abs(Math.cos(time * 5 + c.z));
    ctx.fillStyle = 'rgba(60,30,60,.12)'; const g = P(c.x, 0, c.z); ctx.beginPath(); ctx.ellipse(g.x, g.y, r * .9, r * .25, 0, 0, 7); ctx.fill();
    ctx.translate(p.x, p.y); ctx.scale(Math.max(.2, sx), 1);
    ctx.fillStyle = '#d99a00'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(0, 0, r * .78, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff2b0'; ctx.beginPath(); ctx.arc(-r * .25, -r * .25, r * .28, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawItem(it) {
    const p = P(it.x, it.y + Math.sin(time * 4) * .03, it.z), r = .1 * p.s;
    ctx.save(); ctx.globalAlpha = fogA(it.z); ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ff8fbd'; ctx.lineWidth = Math.max(1, r * .12); ctx.stroke();
    ctx.scale(r / 18, r / 18);
    if (it.kind === 'magnet') { ctx.strokeStyle = '#e04a5a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -1, 7, Math.PI, 0, true); ctx.stroke(); ctx.fillStyle = '#c9d3e6'; ctx.fillRect(-10, -3, 6, 6); ctx.fillRect(4, -3, 6, 6); }
    else if (it.kind === 'shield') { ctx.fillStyle = '#7cc8ff'; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, -6); ctx.quadraticCurveTo(9, 6, 0, 11); ctx.quadraticCurveTo(-9, 6, -9, -6); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#e9609c'; ctx.beginPath(); ctx.ellipse(0, 3, 11, 6, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(0, -12); ctx.lineTo(6, -2); ctx.fill(); }
    ctx.restore();
  }

  function drawPlayers() {
    const zp = P(px, py, ZP), s = zp.s / PS * .5; const tagS = Math.min(1.15, s / .5);
    const pose = state === 'dead' ? 'fall' : slideT > 0 ? 'slide' : !grounded ? 'jump' : 'run';
    const blink = inv > 0 && Math.floor(time * 12) % 2 === 0;
    const gp = P(px, 0, ZP);
    // Chom
    const cp = P(chom.x, chom.y, ZP - .05), cs = cp.s / PS * .5;
    const cpose = state === 'dead' ? 'sit' : chom.slideT > 0 ? 'slide' : chom.y > 0 ? 'jump' : 'run';
    const drawChom = () => { chomBack(ctx, cp.x, cp.y, cs * 1.05, time, state === 'play' ? cpose : 'idle'); nameTag(ctx, cp.x, cp.y - (cpose === 'slide' ? 80 : 120) * cs * 1.05, 'Chom', Math.min(.95, .8 * cs / .5)); };
    if (chom.x > px) { if (!blink) drawZeynAt(); drawChom(); } else { drawChom(); if (!blink) drawZeynAt(); }
    function drawZeynAt() {
      // yerdagi soya Zeyn sakraganda ham yerda qoladi
      ctx.fillStyle = 'rgba(60,30,60,.18)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, 46 * s, 9 * s, 0, 0, 7); ctx.fill();
      zeynBack(ctx, zp.x, zp.y, s, time, state === 'menu' || state === 'shop' ? 'run' : pose);
      if (shield) { ctx.strokeStyle = `rgba(124,200,255,${.6 + Math.sin(time * 6) * .2})`; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(124,200,255,.15)'; ctx.beginPath(); ctx.ellipse(zp.x, zp.y - 140 * s, 80 * s, 160 * s, 0, 0, 7); ctx.fill(); ctx.stroke(); }
      nameTag(ctx, zp.x, zp.y - (pose === 'slide' ? 140 : 312) * s, 'Zeyn', tagS);
    }
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawSky();
    drawGround();
    // chuqurlik bo'yicha: uzoqdan yaqinga
    const list = [];
    for (const s of scene) list.push({ z: s.z, d: () => drawScene(s) });
    for (const o of obs) if (!o.dead) list.push({ z: o.z + (o.type === 'avtobus' ? 0 : o.d * .5), d: () => drawObstacle(o) });
    for (const c of coins) list.push({ z: c.z, d: () => drawCoin(c) });
    for (const it of items) list.push({ z: it.z, d: () => drawItem(it) });
    if (state === 'menu') list.push({ z: ZP, d: () => {
      zeynFront(ctx, 150, 570, .72, time); nameTag(ctx, 150, 570 - 300 * .72, 'Zeyn', 1);
      chomFront(ctx, 285, 572, .95, time); nameTag(ctx, 285, 572 - 150 * .95, 'Chom', .85);
    } });
    else list.push({ z: ZP, d: drawPlayers });
    list.sort((a, b) => b.z - a.z).forEach(e => e.d());

    for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // tezlik chiziqlari
    if (state === 'play' && speed > 16) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) { const a = (i * 1.7 + time * 3) % 6.28, r0 = 120 + ((time * 400 + i * 90) % 220); ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, 330 + Math.sin(a) * r0 * .8); ctx.lineTo(W / 2 + Math.cos(a) * (r0 + 40), 330 + Math.sin(a) * (r0 + 40) * .8); ctx.stroke(); }
    }
    ctx.textAlign = 'center'; ctx.font = '24px "Lilita One", sans-serif';
    for (const f of floats) { ctx.globalAlpha = 1 - f.t; ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x, f.y - f.t * 40 + 2); ctx.fillStyle = f.c; ctx.fillText(f.text, f.x, f.y - f.t * 40); }
    ctx.globalAlpha = 1;
    // bonus taymerlari
    if (state === 'play') {
      let bx = 12;
      const bar = (label, v, max, col) => { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.roundRect(bx, 64, 100, 22, 11); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(bx + 3, 67, 94 * v / max, 16, 8); ctx.fill(); ctx.fillStyle = '#5a3352'; ctx.font = '600 12px "Outfit", sans-serif'; ctx.fillText(label, bx + 50, 80); bx += 108; };
      if (magnet > 0) bar('Magnit', magnet, 10, '#ffb0b8');
      if (shoes > 0) bar('Tufli', shoes, 10, '#dcc8ff');
      if (shield) bar('Qalqon', 1, 1, '#bfe4ff');
    }
    // o'rgatish
    if (state === 'play' && tutT > 0) {
      ctx.globalAlpha = Math.min(1, tutT);
      ctx.fillStyle = 'rgba(90,51,82,.85)'; ctx.beginPath(); ctx.roundRect(40, 120, 320, 96, 18); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '600 15px "Outfit", sans-serif';
      ctx.fillText('← →  svayp — yo\'lak almashtirish', W / 2, 150);
      ctx.fillText('↑  svayp — sakrash', W / 2, 174);
      ctx.fillText('↓  svayp — engashish', W / 2, 198);
      ctx.globalAlpha = 1;
    }
  }

  // ====================== sikl ======================
  let last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.033, (now - (last || now)) / 1000); last = now;
    if (state !== 'paused') update(dt);
    draw();
    if (!$('sShop').hidden) drawPreview();
  }

  // ====================== kiritish ======================
  let t0 = null;
  cvs.addEventListener('pointerdown', e => { t0 = { x: e.clientX, y: e.clientY, used: false }; try { cvs.setPointerCapture(e.pointerId); } catch {} });
  cvs.addEventListener('pointermove', e => {
    if (!t0 || t0.used) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24 * Math.max(.6, scale)) return;
    t0.used = true;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide();
  });
  cvs.addEventListener('pointerup', () => { if (t0 && !t0.used && state === 'play') jump(); t0 = null; });
  window.addEventListener('keydown', e => {
    const k = e.code;
    if (['ArrowLeft', 'KeyA'].includes(k)) { e.preventDefault(); move(-1); }
    else if (['ArrowRight', 'KeyD'].includes(k)) { e.preventDefault(); move(1); }
    else if (['ArrowUp', 'KeyW', 'Space'].includes(k)) { e.preventDefault(); if (state === 'menu' && k === 'Space') startRun(); else jump(); }
    else if (['ArrowDown', 'KeyS'].includes(k)) { e.preventDefault(); slide(); }
    else if (k === 'KeyP' || k === 'Escape') togglePause();
    else if (k === 'KeyM') toggleMute();
  });

  // ====================== ekranlar ======================
  function show(id) {
    for (const s of ['sMenu', 'sShop', 'sOver', 'sPause']) $(s).hidden = s !== id;
    $('hud').hidden = !(state === 'play' || state === 'paused' || state === 'dead');
    if (id === 'sMenu') { $('mBest').textContent = `🏆 ${save.best} m`; $('mCoins').textContent = save.coins; }
  }
  function startRun() { resetRun(); initScene(); state = 'play'; show(null); $('hCoins').textContent = save.coins; sfx(523, .1, 'triangle', .05); setTimeout(() => sfx(784, .14, 'triangle', .05), 100); }
  function toMenu() { state = 'menu'; resetRun(); show('sMenu'); }
  function togglePause() {
    if (state === 'play') { state = 'paused'; show('sPause'); }
    else if (state === 'paused') { state = 'play'; show(null); }
  }
  function toggleMute() { save.muted = !save.muted; persist(); $('bMute').textContent = 'Ovoz: ' + (save.muted ? "o'chiq" : 'yoqiq'); }

  // do'kon
  let tab = 'dress';
  const pv = $('prev'), pc = pv.getContext('2d');
  (() => { const r = Math.min(3, window.devicePixelRatio || 1); pv.width = 220 * r; pv.height = 170 * r; pc.setTransform(r, 0, 0, r, 0, 0); })();
  function drawPreview() {
    pc.clearRect(0, 0, 220, 170);
    pc.fillStyle = '#fdeef3'; pc.beginPath(); pc.ellipse(110, 160, 90, 12, 0, 0, 7); pc.fill();
    zeynFront(pc, 82, 160, .5, time);
    chomFront(pc, 168, 160, .62, time);
  }
  function openShop() { show('sShop'); renderShop(); }
  function renderShop() {
    $('sCoins').textContent = save.coins;
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
    const G = $('grid'); G.innerHTML = '';
    for (const it of SHOP[tab]) {
      const owned = save.own[tab].includes(it.id), sel = save[tab] === it.id;
      const b = document.createElement('button'); b.className = 'item' + (!owned && save.coins < it.cost ? ' locked' : '');
      b.setAttribute('aria-pressed', sel);
      const bg = it.atlas ? `repeating-linear-gradient(100deg,${it.c[1]} 0 5px,#ffd84a 5px 8px,${it.c[2]} 8px 13px,#3fd0c9 13px 16px)` : it.c.length > 1 ? `linear-gradient(135deg,${it.c[0]},${it.c[it.c.length - 1]})` : it.c[0];
      b.innerHTML = `<span class="sw" style="background:${bg}"></span><span>${it.name}</span>` + (owned ? `<span class="own">${sel ? 'Tanlangan' : 'Tanlash'}</span>` : `<span class="price"><span class="coin"></span>${it.cost}</span>`);
      b.onclick = () => {
        if (owned) { save[tab] = it.id; persist(); sfx(880, .06, 'triangle', .04); }
        else if (save.coins >= it.cost) { save.coins -= it.cost; save.own[tab].push(it.id); save[tab] = it.id; persist(); sfx(660, .1, 'triangle', .05); setTimeout(() => sfx(990, .12, 'triangle', .05), 80); if (tab === 'collar') meow(); }
        else { sfx(200, .12, 'square', .04); b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200); return; }
        renderShop();
      };
      G.appendChild(b);
    }
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderShop(); });

  $('bPlay').onclick = startRun;
  $('bRetry').onclick = startRun;
  $('bShop').onclick = openShop;
  $('bOverShop').onclick = () => { state = 'menu'; resetRun(); openShop(); };
  $('bShopClose').onclick = () => { state = 'menu'; show('sMenu'); };
  $('bOverMenu').onclick = toMenu;
  $('bPause').onclick = togglePause;
  $('bResume').onclick = togglePause;
  $('bQuit').onclick = () => { save.coins += runCoins; runCoins = 0; persist(); toMenu(); };
  $('bMute').onclick = toggleMute;
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  $('bMute').textContent = 'Ovoz: ' + (save.muted ? "o'chiq" : 'yoqiq');
  resetRun(); show('sMenu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
